name: Ecosystem pedagogical coverage check
on:
  push:
    branches: [research/ecosystem-mapping-pilot]
    paths: ['research/ecosystem-mapping/COUVERTURE_APS_V01.csv','research/ecosystem-mapping/COUVERTURE_FONCTIONS_V01.csv','research/ecosystem-mapping/COUVERTURE_CONTEXTES_V01.csv','research/ecosystem-mapping/check_pedagogical_coverage.py','.github/workflows/ecosystem-pedagogical-coverage.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/ecosystem-mapping/check_pedagogical_coverage.py
