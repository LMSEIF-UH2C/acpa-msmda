name: Ecosystem identity sensitivity audit
on:
  push:
    branches: [research/ecosystem-mapping-pilot]
    paths: ['research/ecosystem-mapping/audit_identity_sensitivity.py','research/ecosystem-mapping/tests/test_audit_identity_sensitivity.py','.github/workflows/ecosystem-identity-sensitivity.yml']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s research/ecosystem-mapping/tests -p test_audit_identity_sensitivity.py -v
      - name: Retrieve archived pilot ZIPs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir legacy-input
          for pair in baseline:15239399393 expansion:15256204849 fdroid:15240162575 github:15257215003; do
            key="${pair%:*}"
            id="${pair#*:}"
            curl --fail --silent --show-error --location --max-time 90 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$id/zip" -o "legacy-input/$key.zip"
          done
      - run: python research/ecosystem-mapping/audit_identity_sensitivity.py --catalog data/real_tools_catalog.json --archives legacy-input --output sensitivity-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecosystem-identity-sensitivity-audit
          path: sensitivity-output/sensitivity_report.json
          retention-days: 30
          if-no-files-found: warn
