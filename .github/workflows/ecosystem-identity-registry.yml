name: Ecosystem persistent identity registry pilot
on:
  push:
    branches: [research/ecosystem-mapping-pilot]
    paths: ['research/ecosystem-mapping/identity_registry.py','research/ecosystem-mapping/tests/test_identity_registry.py','.github/workflows/ecosystem-identity-registry.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s research/ecosystem-mapping/tests -p 'test_identity*.py' -v
      - run: python research/ecosystem-mapping/identity_registry.py --catalog data/real_tools_catalog.json --output registry-output
      - uses: actions/upload-artifact@v4
        with:
          name: ecosystem-relational-review-kit
          path: |
            registry-output/registry_report.json
            registry-output/relational_judge_A.csv
            registry-output/relational_judge_B.csv
            registry-output/relational_strata.json
          retention-days: 30
