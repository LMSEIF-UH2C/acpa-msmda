name: Ecosystem mapping GitHub pilot
on:
  push:
    branches: [research/ecosystem-mapping-pilot]
    paths: ['research/ecosystem-mapping/collect_github.py', '.github/workflows/ecosystem-github-pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s research/ecosystem-mapping/tests
      - run: python research/ecosystem-mapping/collect_github.py --output github-pilot-output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecosystem-github-pilot-audit
          path: github-pilot-output/
          retention-days: 7
