[server]
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 1

[client]
toolbarMode = "minimal"
showSidebarNavigation = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#2F6F8F"
textColor = "#1F2933"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F4F6"
