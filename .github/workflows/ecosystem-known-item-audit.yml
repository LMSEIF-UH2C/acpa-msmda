name: Ecosystem known-item coverage pilot
on:
  push:
    branches: [research/ecosystem-mapping-pilot]
    paths: ['research/ecosystem-mapping/known_item_audit.py','research/ecosystem-mapping/KNOWN_ITEM_WITNESSES_V01.json','research/ecosystem-mapping/tests/test_known_item_audit.py','.github/workflows/ecosystem-known-item-audit.yml']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s research/ecosystem-mapping/tests -p test_known_item_audit.py
      - uses: actions/download-artifact@v4
        with:
          name: ecosystem-apple-pilot-audit
          run-id: 46087551165
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          name: ecosystem-apple-v02-coverage
          run-id: 46128443244
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: expansion
      - uses: actions/download-artifact@v4
        with:
          name: ecosystem-fdroid-pilot-audit
          run-id: 46088447913
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: fdroid
      - uses: actions/download-artifact@v4
        with:
          name: ecosystem-github-pilot-audit
          run-id: 46128023711
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: github
      - run: python research/ecosystem-mapping/known_item_audit.py --baseline baseline --expansion expansion --fdroid fdroid --github github --output witness-output
      - uses: actions/upload-artifact@v4
        with:
          name: ecosystem-known-item-audit
          path: witness-output/
          retention-days: 30
