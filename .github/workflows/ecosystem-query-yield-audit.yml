name: Ecosystem query yield audit
on:
  push:
    branches: [research/ecosystem-mapping-pilot]
    paths: ['research/ecosystem-mapping/audit_query_yield.py', 'research/ecosystem-mapping/tests/test_audit_query_yield.py', '.github/workflows/ecosystem-query-yield-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s research/ecosystem-mapping/tests -p test_audit_query_yield.py
      - uses: actions/download-artifact@v4
        with:
          name: ecosystem-apple-pilot-audit
          run-id: 46087551165
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: baseline
      - name: Audit available verified snapshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(gh api repos/$GITHUB_REPOSITORY/actions/runs/46128443244 --jq '.status')
          if [ "$status" = "completed" ] && [ "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/46128443244/artifacts --jq '[.artifacts[] | select(.name == "ecosystem-apple-v02-coverage" and .expired == false)] | length')" -gt 0 ]; then
            gh run download 46128443244 --name ecosystem-apple-v02-coverage --dir expansion
            python research/ecosystem-mapping/audit_query_yield.py --baseline baseline --expansion expansion --output yield-output
          else
            python research/ecosystem-mapping/audit_query_yield.py --baseline baseline --output yield-output
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ecosystem-query-yield-audit
          path: yield-output/
          retention-days: 30
