name: Tests ACPA MSMDA
on:
  push:
    branches: [main, feat/performance-lab-mvp, "release/**", "design/**"]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify dependency compatibility
        run: python -m pip check
      - name: Check Python syntax
        run: python -m compileall -q app.py pages src tests
      - name: Check that context tests catch a broken persistence
        run: python scripts/mutation_check.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
