[server]
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 1

[client]
toolbarMode = "minimal"
showSidebarNavigation = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#C1272D"
textColor = "#1F2937"
backgroundColor = "#F8F7F3"
secondaryBackgroundColor = "#F2ECE8"
