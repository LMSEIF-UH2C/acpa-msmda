name: Ecosystem offline SILL Wikidata evidence audit
on:
  push:
    branches: [research/ecosystem-mapping-pilot]
    paths: ['research/ecosystem-mapping/audit_sill_wikidata.py','.github/workflows/ecosystem-evidence-audit.yml']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve exact archived ZIPs (GitHub only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir evidence-input
          for pair in sill:15260778228 wikidata:15261401982 failure:15261211517; do
            key="${pair%:*}"
            id="${pair#*:}"
            curl --fail --silent --show-error --location --max-time 30 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$id/zip" -o "evidence-input/$key.zip"
          done
      - run: python research/ecosystem-mapping/audit_sill_wikidata.py --sill evidence-input/sill.zip --wikidata evidence-input/wikidata.zip --failure evidence-input/failure.zip --catalog data/real_tools_catalog.json --output audit-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecosystem-offline-evidence-audit
          path: audit-output/
          retention-days: 30
          if-no-files-found: warn
