name: Public web demo

on:
  push:
    branches: [main, feat/streamlit-web-demo]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install web app dependency
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py src tests
      - name: Verify published engine
        run: python run_engine.py --language fr --query "basketball sans connexion"
      - name: Smoke-test web interface
        run: python -m unittest discover -s tests -v
