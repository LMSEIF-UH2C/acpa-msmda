name: Mobile navigation REC-Y002
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  mobile-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app and browser test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright==1.52.0
          python -m playwright install --with-deps chromium webkit
      - name: Start Streamlit and verify navigation
        shell: bash
        run: |
          python -m streamlit run app.py --server.headless=true --server.address=127.0.0.1 --server.port=8501 > streamlit-mobile.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8501/_stcore/health
          python scripts/check_mobile_navigation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: streamlit-mobile-log
          path: streamlit-mobile.log
