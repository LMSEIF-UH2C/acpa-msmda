[server]
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 1

[client]
toolbarMode = "minimal"
showSidebarNavigation = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1B44F5"
textColor = "#0B1533"
backgroundColor = "#F5F7FF"
secondaryBackgroundColor = "#EEF2FD"
