name: Ecosystem 10D97P calibration kit
on:
  push:
    branches: [research/ecosystem-mapping-pilot]
    paths: ['research/ecosystem-mapping/calibration_10d97p.py','research/ecosystem-mapping/CALIBRATION_CASES_V01.json','research/ecosystem-mapping/tests/test_calibration_10d97p.py','.github/workflows/ecosystem-calibration-kit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s research/ecosystem-mapping/tests -p test_calibration_10d97p.py
      - run: python research/ecosystem-mapping/calibration_10d97p.py generate --output calibration-kit
      - uses: actions/upload-artifact@v4
        with:
          name: ecosystem-10d97p-calibration-kit
          path: calibration-kit/
          retention-days: 30
