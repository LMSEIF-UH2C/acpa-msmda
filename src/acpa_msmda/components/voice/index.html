<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
 body{margin:0;font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:transparent}
 button{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;height:40px;border-radius:999px;
   border:1px solid #c7d2fe;background:#fff;color:#1d4ed8;font:inherit;cursor:pointer}
 button.on{background:#dc2626;border-color:#dc2626;color:#fff}
 #m{font-size:12px;color:#52606d;min-height:16px;margin-top:4px;text-align:center}
 svg{width:18px;height:18px;fill:currentColor}
</style></head><body>
<button id="b" type="button"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2z"/></svg><span id="l"></span></button>
<div id="m"></div>
<script>
// Dictée par la reconnaissance vocale du navigateur. Échange avec Streamlit par postMessage
// (protocole des composants : componentReady, render, setComponentValue, setFrameHeight).
let args = {}, rec = null, listening = false;
const B = document.getElementById("b"), L = document.getElementById("l"), M = document.getElementById("m");
const send = (type, extra) => window.parent.postMessage(Object.assign({isStreamlitMessage: true, type}, extra), "*");
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function paint() {
  L.textContent = listening ? args.stop : args.start;
  B.className = listening ? "on" : "";
}
function start() {
  if (!SR) { M.textContent = args.unsupported; return; }
  rec = new SR(); rec.lang = args.lang; rec.interimResults = true; rec.continuous = false;
  let final = "";
  rec.onresult = e => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript; else interim += e.results[i][0].transcript;
    }
    M.textContent = (final + " " + interim).trim();
  };
  rec.onerror = e => { M.textContent = e.error === "not-allowed" ? args.denied : args.failed; };
  rec.onend = () => {
    listening = false; paint();
    if (final.trim()) send("streamlit:setComponentValue", {value: {text: final.trim(), at: Date.now()}, dataType: "json"});
  };
  listening = true; paint(); M.textContent = args.listening; rec.start();
}
B.onclick = () => { if (listening && rec) rec.stop(); else start(); };
window.addEventListener("message", e => {
  if (e.data && e.data.type === "streamlit:render") {
    args = e.data.args || {}; paint();
    if (!SR && !M.textContent) M.textContent = args.unsupported;
    send("streamlit:setFrameHeight", {height: 64});
  }
});
send("streamlit:componentReady", {apiVersion: 1});
</script></body></html>
