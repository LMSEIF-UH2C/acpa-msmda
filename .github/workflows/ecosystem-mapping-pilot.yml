name: Ecosystem mapping pilot
on:
  push:
    branches: [research/ecosystem-mapping-pilot]
    paths: ['research/ecosystem-mapping/collect_apple.py', 'research/ecosystem-mapping/query_matrix.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ecosystem-apple-api-serial
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s research/ecosystem-mapping/tests
      - run: python research/ecosystem-mapping/collect_apple.py --mode pilot --output pilot-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecosystem-apple-pilot-audit
          path: pilot-output/
          retention-days: 7
