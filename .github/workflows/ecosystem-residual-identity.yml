name: Ecosystem residual identity audit
on:
  push:
    branches: [research/ecosystem-mapping-pilot]
    paths: ['research/ecosystem-mapping/audit_residual_identity.py','research/ecosystem-mapping/tests/test_audit_residual_identity.py','.github/workflows/ecosystem-residual-identity.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s research/ecosystem-mapping/tests -p test_audit_residual_identity.py -v
      - run: python research/ecosystem-mapping/audit_residual_identity.py --catalog data/real_tools_catalog.json --output residual-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecosystem-residual-identity-audit
          path: residual-output/residual_identity_report.json
          retention-days: 30
          if-no-files-found: warn
